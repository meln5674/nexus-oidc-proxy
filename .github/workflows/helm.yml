name: Helm

on:
  workflow_dispatch: {}
  push:
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  CHART_REPO_NAME: ${{ github.repository }}/charts

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Get Tag
        id: tagName
        uses: olegtarasov/get-tag@v2.1

      - name: Install Helm
        uses: azure/setup-helm@v1
        with:
          version: v3.8.1
      
      - name: Install YQ
        uses: chrisdickinson/setup-yq@latest
        with:
          yq-version: v4.27.2

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Chart Version
        run: |
          if [ -n "${{ steps.tagName.outputs.tag }}" ]; then
            yq -i '.version = "${{ steps.tagName.outputs.tag }}"' deploy/helm/nexus-oidc-proxy/Chart.yaml
            yq -i '.appVersion = "${{ steps.tagName.outputs.tag }}"' deploy/helm/nexus-oidc-proxy/Chart.yaml
          else
            yq -i '.version = .version + "-'"${GITHUB_SHA}"'"' deploy/helm/nexus-oidc-proxy/Chart.yaml
            yq -i '.appVersion = "'"${GITHUB_SHA}"'"' deploy/helm/nexus-oidc-proxy/Chart.yaml
          fi

      - name: Lint
        run: |
          helm lint deploy/helm/nexus-oidc-proxy
          helm template deploy/helm/nexus-oidc-proxy

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.2'

            # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Push chart
        if: github.event_name != 'pull_request'
        run: |
          helm package deploy/helm/nexus-oidc-proxy --destination bin
          helm push bin/nexus-oidc-proxy-*.tgz 'oci://${{ env.REGISTRY }}/${{ env.CHART_REPO_NAME }}'

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Chart
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COSIGN_EXPERIMENTAL: "true"
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: |
          chart_name=$(yq .name deploy/helm/nexus-oidc-proxy/Chart.yaml)
          chart_version=$(yq .version deploy/helm/nexus-oidc-proxy/Chart.yaml)
          chart_ref="${{ env.REGISTRY }}/${{ env.CHART_REPO_NAME }}/${chart_name}:${chart_version}"
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${chart_ref}
